<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">KisanLink original logo concept board</title>
  <desc id="desc">Four logo concepts shown as icon-only marks and wordmarks on cream and deep green backgrounds.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#123628" flood-opacity=".12"/>
    </filter>
    <style>
      .board-title { font: 800 48px Manrope, Arial, sans-serif; letter-spacing: -2px; fill: #1f2924; }
      .board-subtitle { font: 500 20px Manrope, Arial, sans-serif; fill: #68736d; }
      .concept-label { font: 800 19px Manrope, Arial, sans-serif; letter-spacing: 1.7px; fill: #236747; }
      .concept-note { font: 500 16px Manrope, Arial, sans-serif; fill: #68736d; }
      .word { font: 800 40px Manrope, Arial, sans-serif; letter-spacing: -2px; }
      .word-light { fill: #ffffff; }
      .word-dark { fill: #1f2924; }
      .word-green { fill: #236747; }
      .word-mint { fill: #c9e8d3; }
      .panel-caption { font: 700 13px Manrope, Arial, sans-serif; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1600" height="1500" fill="#ffffff"/>
  <text x="92" y="94" class="board-title">KisanLink identity exploration</text>
  <text x="92" y="132" class="board-subtitle">Original vector directions • current green / cream system • preview only</text>

  <!-- Concept 01: Furrow Link -->
  <g transform="translate(92 205)">
    <text x="0" y="0" class="concept-label">01  FURROW LINK</text>
    <text x="0" y="29" class="concept-note">Two field rows become one direct trade link.</text>
    <g transform="translate(0 58)">
      <rect width="686" height="244" rx="34" fill="#f7f4eb"/>
      <text x="28" y="34" class="panel-caption" fill="#8a948e">CREAM</text>
      <rect x="34" y="62" width="120" height="120" rx="35" fill="#236747" filter="url(#shadow)"/>
      <g transform="translate(51 80)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 45c0-17 13-30 30-30h13c17 0 30 13 30 30S74 75 57 75H47"/>
        <path d="M73 30h-9C47 30 34 43 34 60s13 30 30 30h10c17 0 30-13 30-30" opacity=".92"/>
      </g>
      <path d="M129 86c-15 0-24 8-26 22 15 2 25-5 26-22Z" fill="#ebaf3c"/>
      <g transform="translate(198 103)">
        <text class="word word-dark">Kisan</text><text x="108" class="word word-green">Link</text>
        <text y="36" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#68736d">DIRECT FARM TRADE</text>
      </g>
      <g transform="translate(571 78)">
        <rect width="86" height="86" rx="25" fill="#ffffff" stroke="#dde3dd"/>
        <g transform="translate(13 11) scale(.61)" fill="none" stroke="#236747" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 45c0-17 13-30 30-30h13c17 0 30 13 30 30S74 75 57 75H47"/>
          <path d="M73 30h-9C47 30 34 43 34 60s13 30 30 30h10c17 0 30-13 30-30" opacity=".88"/>
        </g>
      </g>
    </g>
    <g transform="translate(718 58)">
      <rect width="698" height="244" rx="34" fill="#174b34"/>
      <text x="28" y="34" class="panel-caption" fill="#a9c7b4">DARK GREEN</text>
      <rect x="34" y="62" width="120" height="120" rx="35" fill="#f7f4eb"/>
      <g transform="translate(51 80)" fill="none" stroke="#236747" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 45c0-17 13-30 30-30h13c17 0 30 13 30 30S74 75 57 75H47"/>
        <path d="M73 30h-9C47 30 34 43 34 60s13 30 30 30h10c17 0 30-13 30-30" opacity=".92"/>
